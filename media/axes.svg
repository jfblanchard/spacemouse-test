<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 330" width="780" height="330" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="mo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8590c"/>
    </marker>
    <marker id="mw" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#ffffff"/>
    </marker>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1c7ed6"/>
    </marker>
  </defs>

  <rect width="780" height="330" rx="14" fill="#f8f9fa"/>

  <!-- Top view: slide X/Y, twist -->
  <text x="130" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057" letter-spacing="1">TOP</text>
  <circle cx="130" cy="170" r="82" fill="#343a40"/>
  <circle cx="130" cy="170" r="54" fill="#6c757d"/>
  <rect x="44" y="157" width="8" height="26" rx="3" fill="#adb5bd"/>
  <rect x="208" y="157" width="8" height="26" rx="3" fill="#adb5bd"/>
  <line x1="94" y1="170" x2="166" y2="170" stroke="#fff" stroke-width="3" marker-start="url(#mw)" marker-end="url(#mw)"/>
  <line x1="130" y1="134" x2="130" y2="206" stroke="#fff" stroke-width="3" marker-start="url(#mw)" marker-end="url(#mw)"/>
  <path d="M 48.6 123 A 94 94 0 0 1 211.4 123" fill="none" stroke="#1c7ed6" stroke-width="3" marker-end="url(#mb)"/>
  <text x="130" y="62" text-anchor="middle" font-size="12" fill="#1c7ed6">twist (RZ)</text>
  <text x="130" y="276" text-anchor="middle" font-size="12" fill="#212529">slide X (left / right)</text>
  <text x="130" y="293" text-anchor="middle" font-size="12" fill="#212529">slide Y (forward / back)</text>
  <text x="38" y="174" text-anchor="end" font-size="11" fill="#868e96">L btn</text>
  <text x="222" y="174" font-size="11" fill="#868e96">R btn</text>

  <!-- Side view: push/pull Z, tilt -->
  <text x="390" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057" letter-spacing="1">SIDE</text>
  <path d="M 310 230 L 470 230 L 462 205 L 318 205 Z" fill="#343a40"/>
  <rect x="340" y="172" width="100" height="34" rx="12" fill="#6c757d"/>
  <line x1="390" y1="108" x2="390" y2="160" stroke="#e8590c" stroke-width="3" marker-start="url(#mo)" marker-end="url(#mo)"/>
  <text x="400" y="138" font-size="12" fill="#e8590c">Z push / pull</text>
  <path d="M 283 150 A 110 110 0 0 1 497 150" fill="none" stroke="#1c7ed6" stroke-width="3" marker-start="url(#mb)" marker-end="url(#mb)"/>
  <text x="390" y="54" text-anchor="middle" font-size="12" fill="#1c7ed6">tilt fwd / back (RX)</text>
  <text x="300" y="250" font-size="11" fill="#868e96">front</text>
  <text x="480" y="250" text-anchor="end" font-size="11" fill="#868e96">back</text>

  <!-- Front view: roll -->
  <text x="650" y="28" text-anchor="middle" font-size="13" font-weight="bold" fill="#495057" letter-spacing="1">FRONT</text>
  <path d="M 570 230 L 730 230 L 722 205 L 578 205 Z" fill="#343a40"/>
  <rect x="600" y="172" width="100" height="34" rx="12" fill="#6c757d"/>
  <rect x="567" y="210" width="6" height="16" rx="2" fill="#adb5bd"/>
  <rect x="727" y="210" width="6" height="16" rx="2" fill="#adb5bd"/>
  <path d="M 543 150 A 110 110 0 0 1 757 150" fill="none" stroke="#1c7ed6" stroke-width="3" marker-start="url(#mb)" marker-end="url(#mb)"/>
  <text x="650" y="54" text-anchor="middle" font-size="12" fill="#1c7ed6">roll left / right (RY)</text>
  <text x="560" y="250" font-size="11" fill="#868e96">L btn</text>
  <text x="740" y="250" text-anchor="end" font-size="11" fill="#868e96">R btn</text>

  <text x="390" y="314" text-anchor="middle" font-size="11" fill="#868e96">SpaceMouse Compact: 3 slides + 3 rotations, raw range about ±350</text>
</svg>
